<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA기술담당 AI워크샵 OX 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" rel="stylesheet">
    
    <!-- 파이어베이스 데이터베이스 라이브러리 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        body { font-family: 'Pretendard', sans-serif; background-color: #E8EDF8; color: #1C234D; user-select: none; }
        .bg-navy { background-color: #212962; }
        .text-navy { color: #212962; }
        .btn-locked { background-color: #FBBF24 !important; border-color: #FBBF24 !important; color: #fff !important; cursor: not-allowed; }
        .hidden { display: none !important; }
        .allow-select { user-select: text !important; -webkit-user-select: text !important; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- 메인 대시보드 화면 -->
    <div id="view-main" class="w-full max-w-6xl w-full">
        <div class="flex justify-between items-end mb-6">
            <div>
                <h1 class="text-4xl font-black mb-2 tracking-tight">FA기술담당 AI워크샵</h1>
                <div class="flex items-center gap-3 font-bold text-lg">
                    <span class="text-blue-600">O</span> <span class="text-red-500">X</span> 
                    <span class="text-gray-500 text-base font-medium">OX 퀴즈</span>
                    <span id="main-question-num" class="bg-navy text-white text-sm px-4 py-1 rounded-full">1번 문제</span>
                </div>
            </div>
            <button onclick="navigate('admin-login')" class="bg-navy text-white px-5 py-2 rounded-lg font-bold hover:bg-opacity-90 transition">관리자</button>
        </div>

        <!-- 6개 팀 카드 -->
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="team-cards-container">
            <!-- 자바스크립트로 렌더링 됨 -->
        </div>
    </div>

    <!-- 팀별 투표 및 텍스트 입력 화면 -->
    <div id="view-team" class="hidden w-full max-w-4xl w-full flex-col h-auto min-h-[80vh] pb-10">
        <div class="flex justify-between items-center mb-8">
            <button onclick="navigate('main')" class="bg-white text-navy border-2 border-[#212962] px-6 py-2 rounded-xl font-bold hover:bg-gray-50 transition">메인으로</button>
            <span id="team-question-num" class="bg-navy text-white text-sm px-4 py-1 rounded-full font-bold">1번 문제</span>
        </div>
        <div class="flex justify-between items-end mb-4">
            <h2 id="team-title" class="text-5xl font-black text-navy">1조</h2>
            <div class="text-2xl font-black text-navy"><span id="team-score-display">0</span><span class="text-lg">점</span></div>
        </div>
        <p class="text-gray-600 mb-6 font-medium">정답이라고 생각하는 쪽을 누르세요. (한 번 누르면 바꿀 수 없습니다)</p>
        
        <!-- O / X 버튼 구역 -->
        <div class="flex gap-6 h-64 mb-8">
            <button onclick="submitAnswer('O')" id="btn-O" class="flex-1 bg-navy text-white text-[8rem] font-bold rounded-[2rem] hover:bg-opacity-90 transition flex items-center justify-center border-4 border-transparent">O</button>
            <button onclick="submitAnswer('X')" id="btn-X" class="flex-1 bg-navy text-white text-[8rem] font-bold rounded-[2rem] hover:bg-opacity-90 transition flex items-center justify-center border-4 border-transparent">X</button>
        </div>

        <!-- 서술형 텍스트 입력 구역 -->
        <div class="flex flex-col gap-3 bg-white p-6 rounded-[2rem] shadow-sm border border-gray-200">
            <div class="flex justify-between items-center">
                <label class="text-navy font-bold text-lg">추가 의견 작성 (선택사항)</label>
                <span class="text-xs text-gray-400">최대 200자</span>
            </div>
            <textarea id="team-text-input" maxlength="200" class="allow-select w-full p-4 rounded-xl border-2 border-gray-300 focus:border-navy focus:outline-none resize-none h-32 text-base transition-colors" placeholder="여기에 내용을 입력하세요..."></textarea>
            <button onclick="submitTextAnswer()" id="btn-submit-text" class="bg-navy text-white font-bold py-4 rounded-xl hover:bg-opacity-90 transition text-lg mt-2">의견 제출하기</button>
            <p id="text-submit-msg" class="hidden text-center text-green-600 font-bold mt-2">✅ 의견이 성공적으로 제출되었습니다. (수정 불가)</p>
        </div>
    </div>

    <!-- 관리자 로그인 화면 -->
    <div id="view-admin-login" class="hidden w-full max-w-md w-full flex-col items-center justify-center h-[70vh]">
        <h2 class="text-4xl font-black text-navy mb-4">관리자</h2>
        <p class="text-gray-600 mb-8 font-medium">비밀번호 4자리를 입력하세요.</p>
        <input type="password" id="admin-pw" class="w-full border-2 border-blue-400 rounded-xl text-center text-3xl py-4 mb-8 focus:outline-none focus:border-navy" maxlength="4">
        <div class="flex gap-4">
            <button onclick="navigate('main')" class="bg-white border-2 border-gray-300 text-navy px-8 py-3 rounded-xl font-bold hover:bg-gray-50 transition">메인으로</button>
            <button onclick="checkAdmin()" class="bg-navy text-white px-8 py-3 rounded-xl font-bold hover:bg-opacity-90 transition">들어가기</button>
        </div>
    </div>

    <!-- 관리자 컨트롤 화면 -->
    <div id="view-admin" class="hidden w-full max-w-6xl w-full">
        <div class="flex justify-between items-center mb-8">
            <h2 class="text-3xl font-black text-navy">관리자 페이지</h2>
            <div class="flex gap-3">
                <button onclick="navigate('main')" class="bg-white border-2 border-gray-300 text-navy px-5 py-2 rounded-lg font-bold hover:bg-gray-50 transition">메인으로</button>
                <button onclick="resetGame()" class="bg-red-500 text-white px-5 py-2 rounded-lg font-bold hover:bg-red-600 transition">전체 리셋</button>
            </div>
        </div>

        <div class="flex items-center gap-4 mb-6
