<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FA기술담당 AI워크샵 OX 퀴즈</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif; /* Standard modern font */
            background-color: #E8EBF5; /* Light bluish background from design */
            user-select: none;
        }
        
        /* Custom Colors based on the images */
        .bg-navy { background-color: #1E2B65; }
        .text-navy { color: #1E2B65; }
        .border-navy { border-color: #1E2B65; }
        
        .bg-navy-light { background-color: #2A3B82; } /* Slightly lighter for hover */
        
        .text-yellow-custom { color: #FFD600; }
        .border-yellow-custom { border-color: #FFD600; }
        .bg-yellow-custom { background-color: #FFD600; }
        
        .bg-green-custom { background-color: #27AE60; }
        .bg-red-custom { background-color: #C0392B; }

        /* Smooth transitions */
        .transition-all { transition: all 0.2s ease-in-out; }
    </style>
</head>
<body class="min-h-screen text-gray-800">

    <!-- App Container -->
    <div id="app" class="w-full max-w-7xl mx-auto p-4 md:p-8 h-full">
        <!-- Views will be injected here -->
    </div>

    <script>
        // State Management
        const state = {
            currentView: 'MAIN', // MAIN, TEAM, ADMIN_LOGIN, ADMIN
            activeTeamId: null,
            questionNumber: 1,
            teams: Array.from({ length: 6 }, (_, i) => ({
                id: i + 1,
                score: 0,
                selection: null // 'O', 'X', or null
            }))
        };

        const PASSWORD = "8688";
        const appContainer = document.getElementById('app');

        // Helper to get rankings
        function updateRankings() {
            const sortedTeams = [...state.teams].sort((a, b) => b.score - a.score);
            let currentRank = 1;
            let previousScore = sortedTeams[0].score;
            
            sortedTeams.forEach((team, index) => {
                if (team.score < previousScore) {
                    currentRank = index + 1;
                    previousScore = team.score;
                }
                const originalTeam = state.teams.find(t => t.id === team.id);
                originalTeam.rank = currentRank;
            });
        }

        function handleTeamSelect(teamId) {
            state.activeTeamId = teamId;
            renderTeamView();
        }

        function handleAnswerSelection(answer) {
            const team = state.teams.find(t => t.id === state.activeTeamId);
            // Only allow selection if not already selected
            if (team && team.selection === null) {
                team.selection = answer;
                renderTeamView(); // Re-render to show selection
            }
        }

        function adjustScore(teamId, amount) {
            const team = state.teams.find(t => t.id === teamId);
            if (team) {
                team.score += amount;
                updateRankings();
                renderAdminView();
            }
        }

        function resolveQuestion(correctAnswer) {
            state.teams.forEach(team => {
                if (team.selection === correctAnswer) {
                    team.score += 5;
                } else if (team.selection !== null && team.selection !== correctAnswer) {
                    team.score -= 5;
                }
                // Reset selection for the next round
                team.selection = null;
            });
            state.questionNumber++;
            updateRankings();
            renderAdminView();
        }

        function resetGame() {
            if(confirm("모든 점수와 상태가 초기화됩니다. 계속하시겠습니까?")) {
                state.questionNumber = 1;
                state.teams.forEach(team => {
                    team.score = 0;
                    team.selection = null;
                });
                updateRankings();
                renderAdminView();
            }
        }

        function renderMainView() {
            state.currentView = 'MAIN';
            updateRankings();
            
            let html = `
                <div class="flex justify-between items-center mb-8">
                    <div>
                        <h1 class="text-4xl md:text-5xl font-black text-navy tracking-tight mb-2">FA기술담당 AI워크샵</h1>
                        <div class="flex items-center space-x-3 text-lg font-bold text-navy">
                            <span class="text-blue-600">O</span>
                            <span class="text-red-500">X</span>
                            <span>OX 퀴즈</span>
                            <span class="bg-navy text-white px-4 py-1 rounded-full text-sm">${state.questionNumber}번 문제</span>
                        </div>
                    </div>
                    <button onclick="renderAdminLoginView()" class="bg-navy hover:bg-navy-light text-white font-bold py-3 px-6 rounded-xl transition-all shadow-md">관리자</button>
                </div>

                <div class="grid grid-cols-2 md:grid-cols-3 gap-6">
            `;

            state.teams.forEach(team => {
                const isFirstPlace = team.rank === 1 && team.score > 0;
                const borderClass = isFirstPlace ? 'border-4 border-yellow-custom' : 'border-4 border-transparent shadow-lg';
                const rankColor = isFirstPlace ? 'text-yellow-custom' : 'text-gray-400';
                
                let statusText = "선택 전";
                let statusColor = "text-gray-400";
                let dotColor = "bg-gray-400";
                
                if (team.selection === 'O') {
                    statusText = "O 선택 완료";
                    statusColor = "text-blue-400";
                    dotColor = "bg-blue-400";
                } else if (team.selection === 'X') {
                    statusText = "X 선택 완료";
                    statusColor = "text-red-400";
                    dotColor = "bg-red-400";
                }

                html += `
                    <div onclick="handleTeamSelect(${team.id})" class="bg-navy rounded-2xl p-6 cursor-pointer transform hover:scale-105 transition-all ${borderClass} flex flex-col justify-between aspect-[4/3]">
                        <div class="flex justify-between items-start w-full">
                            <span class="text-white text-3xl font-black">${team.id}조</span>
                            <span class="font-bold ${rankColor}">${team.rank}위</span>
                        </div>
                        <div class="text-center my-auto">
                            <span class="text-white text-7xl font-black">${team.score}</span>
                            <span class="text-gray-300 text-xl font-bold ml-1">점</span>
                        </div>
                        <div class="flex items-center space-x-2 mt-auto">
                            <div class="w-3 h-3 rounded-full ${dotColor}"></div>
                            <span class="text-sm font-bold ${statusColor}">${statusText}</span>
                        </div>
                    </div>
                `;
            });

            html += `</div>`;
            appContainer.innerHTML = html;
        }

        function renderTeamView() {
            state.currentView = 'TEAM';
            const team = state.teams.find(t => t.id === state.activeTeamId);
            
            const oIsSelected = team.selection === 'O';
            const xIsSelected = team.selection === 'X';
            
            const oButtonClass = oIsSelected ? 'bg-yellow-custom text-navy scale-105 shadow-xl' : 'bg-navy text-white hover:bg-navy-light';
            const xButtonClass = xIsSelected ? 'bg-yellow-custom text-navy scale-105 shadow-xl' : 'bg-navy text-white hover:bg-navy-light';
            
            // If any selection is made, disable clicks visually
            const pointerEvents = team.selection !== null ? 'pointer-events-none' : '';

            appContainer.innerHTML = `
                <div class="flex flex-col h-[80vh]">
                    <div class="flex justify-between items-center mb-12">
                        <button onclick="renderMainView()" class="bg-gray-200 hover:bg-gray-300 text-navy font-bold py-3 px-6 rounded-xl transition-all shadow-sm">메인으로</button>
                        <span class="bg-navy text-white px-5 py-2 rounded-full font-bold shadow-md">${state.questionNumber}번 문제</span>
                    </div>

                    <div class="flex justify-between items-end mb-8">
                        <div>
                            <h2 class="text-6xl font-black text-navy mb-2">${team.id}조</h2>
                            <p class="text-xl text-gray-600 font-bold">정답이라고 생각하는 쪽을 누르세요.</p>
                            ${team.selection !== null ? '<p class="text-red-500 font-bold mt-2">선택이 완료되었습니다. 변경할 수 없습니다.</p>' : ''}
                        </div>
                        <div class="text-right">
                            <span class="text-4xl font-black text-navy">${team.score}</span>
                            <span class="text-xl font-bold text-navy">점</span>
                        </div>
                    </div>

                    <div class="flex-1 flex gap-8">
                        <button onclick="handleAnswerSelection('O')" class="flex-1 rounded-[40px] text-[15rem] font-black flex items-center justify-center transition-all ${oButtonClass} ${pointerEvents}">
                            O
                        </button>
                        <button onclick="handleAnswerSelection('X')" class="flex-1 rounded-[40px] text-[15rem] font-black flex items-center justify-center transition-all ${xButtonClass} ${pointerEvents}">
                            X
                        </button>
                    </div>
                </div>
            `;
        }

        function renderAdminLoginView() {
            state.currentView = 'ADMIN_LOGIN';
            
            appContainer.innerHTML = `
                <div class="flex flex-col items-center justify-center h-[80vh]">
                    <h2 class="text-5xl font-black text-navy mb-6">관리자</h2>
                    <p class="text-xl text-gray-600 font-medium mb-10">비밀번호 4자리를 입력하세요.</p>
                    
                    <input type="password" id="adminPassword" maxlength="4" class="w-80 h-24 text-center text-5xl font-bold text-navy border-4 border-blue-400 rounded-3xl mb-12 focus:outline-none focus:border-navy bg-transparent shadow-inner" autocomplete="off">
                    
                    <div class="flex space-x-4">
                        <button onclick="renderMainView()" class="bg-gray-200 hover:bg-gray-300 text-navy font-bold py-4 px-10 rounded-2xl text-xl transition-all shadow-md">메인으로</button>
                        <button onclick="checkAdminPassword()" class="bg-navy hover:bg-navy-light text-white font-bold py-4 px-10 rounded-2xl text-xl transition-all shadow-md">들어가기</button>
                    </div>
                </div>
            `;

            // Auto focus and enter key support
            setTimeout(() => {
                const input = document.getElementById('adminPassword');
                if(input) {
                    input.focus();
                    input.addEventListener('keypress', function (e) {
                        if (e.key === 'Enter') checkAdminPassword();
                    });
                }
            }, 100);
        }

        function checkAdminPassword() {
            const input = document.getElementById('adminPassword').value;
            if (input === PASSWORD) {
                renderAdminView();
            } else {
                alert("비밀번호가 틀렸습니다.");
                document.getElementById('adminPassword').value = '';
            }
        }

        function renderAdminView() {
            state.currentView = 'ADMIN';
            
            const selectedCount = state.teams.filter(t => t.selection !== null).length;

            let html = `
                <div class="flex justify-between items-center mb-8">
                    <h1 class="text-4xl font-black text-navy tracking-tight">관리자 페이지</h1>
                    <div class="flex space-x-4">
                        <button onclick="renderMainView()" class="bg-white text-navy border-2 border-gray-200 font-bold py-2 px-6 rounded-xl hover:bg-gray-50 transition-all shadow-sm">메인으로</button>
                        <button onclick="resetGame()" class="bg-red-500 hover:bg-red-600 text-white font-bold py-2 px-6 rounded-xl transition-all shadow-sm">리셋</button>
                    </div>
                </div>

                <div class="flex items-center space-x-3 mb-8">
                    <span class="bg-navy text-white px-4 py-1 rounded-full text-sm font-bold">${state.questionNumber}번 문제</span>
                    <span class="text-gray-600 font-bold">${selectedCount}팀 선택 완료</span>
                </div>

                <div class="grid grid-cols-3 md:grid-cols-6 gap-4 mb-12">
            `;

            state.teams.forEach(team => {
                let statusText = "미선택";
                let statusColor = "text-gray-400";
                if(team.selection === 'O') { statusText = "O 선택"; statusColor = "text-yellow-400"; }
                if(team.selection === 'X') { statusText = "X 선택"; statusColor = "text-yellow-400"; }

                html += `
                    <div class="bg-navy rounded-2xl p-4 flex flex-col items-center shadow-lg">
                        <span class="text-white text-xl font-black mb-2">${team.id}조</span>
                        <span class="text-white text-4xl font-black mb-1">${team.score}</span>
                        <span class="text-xs font-bold ${statusColor} mb-4">${statusText}</span>
                        
                        <button onclick="adjustScore(${team.id}, 5)" class="w-full bg-green-custom hover:bg-green-600 text-white font-bold py-2 rounded-lg mb-2 transition-all shadow-sm text-lg">+5</button>
                        <button onclick="adjustScore(${team.id}, -5)" class="w-full bg-red-custom hover:bg-red-600 text-white font-bold py-2 rounded-lg transition-all shadow-sm text-lg">-5</button>
                    </div>
                `;
            });

            html += `
                </div>
                
                <div class="border-t border-gray-300 pt-8">
                    <h2 class="text-2xl font-black text-navy mb-2">정답 공개</h2>
                    <p class="text-gray-600 font-medium mb-6">정답을 누르면 맞춘 팀 +5점, 틀린 팀 -5점이 반영되고 다음 문제로 넘어갑니다. 선택하지 않은 팀은 점수 변동이 없습니다.</p>
                    
                    <div class="flex space-x-6">
                        <button onclick="resolveQuestion('O')" class="w-48 h-48 bg-navy hover:bg-navy-light rounded-[30px] flex items-center justify-center text-white text-8xl font-black transition-all shadow-xl hover:scale-105">O</button>
                        <button onclick="resolveQuestion('X')" class="w-48 h-48 bg-navy hover:bg-navy-light rounded-[30px] flex items-center justify-center text-white text-8xl font-black transition-all shadow-xl hover:scale-105">X</button>
                    </div>
                </div>
            `;

            appContainer.innerHTML = html;
        }

        // Initialize the app
        window.onload = () => {
            renderMainView();
        };

    </script>
</body>
</html>
